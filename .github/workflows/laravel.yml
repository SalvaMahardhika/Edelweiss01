name: Laravel

on:
  push:
    branches: [ "main", "Task1" ]
  pull_request:
    branches: [ "main", "Task1" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    # 1. Jalankan Service MySQL Container untuk testing
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: db_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo, pdo_mysql, bcmath, ctype, json, openssl, tokenizer, xml
        tools: composer:v2

    - name: Install Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    # 2. Konfigurasi Environment ke MySQL Container
    - name: Prepare Environment
      run: |
        cp .env.example .env || touch .env
        echo "APP_ENV=testing" > .env
        echo "APP_KEY=" >> .env
        echo "DB_CONNECTION=mysql" >> .env
        echo "DB_HOST=127.0.0.1" >> .env
        echo "DB_PORT=3306" >> .env
        echo "DB_DATABASE=db_testing" >> .env
        echo "DB_USERNAME=root" >> .env
        echo "DB_PASSWORD=" >> .env
        php artisan key:generate --env=testing
        php artisan migrate --force --env=testing

    - name: Run Tests (PHPUnit)
      run: php artisan test --env=testing

    - name: Run Laravel Pint (Code Style Check)
      run: ./vendor/bin/pint --test

    - name: Install PHPStan
      run: composer require --dev phpstan/phpstan --no-interaction

    - name: Run PHPStan (Static Analysis)
      run: ./vendor/bin/phpstan analyse app --memory-limit=1G
